documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'wiki/**'
          - 'doc/**'
          - '.docs/**'
ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'composer.json'
          - 'composer.lock'
