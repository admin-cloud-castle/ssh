name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          extensions: mbstring, xml, dom, tokenizer, ctype, json
          ini-values: memory_limit=3G
          tools: composer:v2

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Linters
        run: composer ci:linters

      - name: Static analysis
        run: composer ci:static-analysis

      - name: Tests coverage
        env:
          XDEBUG_MODE: coverage
        run: composer test:coverage

      - name: Upload coverage artifacts
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-clover
          path: var/coverage/clover.xml
          if-no-files-found: warn

      - name: Coveralls
        if: matrix.php == '8.3'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          file: var/coverage/clover.xml
          format: clover
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        continue-on-error: true

      - name: Qlty coverage
        if: matrix.php == '8.3'
        uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2
        with:
          oidc: true
          files: var/coverage/clover.xml
        continue-on-error: true

      - name: Scrutinizer coverage
        if: matrix.php == '8.3'
        continue-on-error: true
        env:
          SCRUTINIZER_TOKEN: ${{ secrets.SCRUTINIZER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! -f var/coverage/clover.xml ]]; then
            echo "clover.xml нет — пропуск ocular"
            exit 0
          fi
          # ocular.phar с сайта — 403 Cloudflare; ставим из Packagist
          composer global require scrutinizer/ocular --no-interaction --no-progress
          ocular_bin="$(composer global config bin-dir --absolute --quiet)/ocular"
          args=(
            code-coverage:upload
            --format=php-clover
            --repository="g/${{ github.repository }}"
            --revision="${{ github.sha }}"
            var/coverage/clover.xml
          )
          if [[ -n "${SCRUTINIZER_TOKEN}" ]]; then
            args+=(--access-token="${SCRUTINIZER_TOKEN}")
          fi
          "${ocular_bin}" "${args[@]}"

      - name: Tests mutation
        run: composer test:mutation

      - name: Meta
        run: composer ci:meta
