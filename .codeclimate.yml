version: "2"
checks:
  argument-count:
    config:
      threshold: 5
  complex-logic:
    config:
      threshold: 5
  file-lines:
    config:
      threshold: 300
  method-complexity:
    config:
      threshold: 10
  method-count:
    config:
      threshold: 25
  method-lines:
    config:
      threshold: 40
  nested-control-flow:
    config:
      threshold: 3
  return-statements:
    config:
      threshold: 5
  similar-code:
    config:
      threshold: 50
  identical-code:
    config:
      threshold: 30
plugins:
  phpcodesniffer:
    enabled: true
  phpmd:
    enabled: true
exclude_patterns:
  - "tests/"
  - "vendor/"
  - "tools/"
  - "var/"
